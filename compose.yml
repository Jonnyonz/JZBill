# JZBill con Docker: app (HTTPS propio en el puerto 9443) + PostgreSQL. Lo arma y lo levanta install-docker.sh,
# que genera la configuracion en JZB_CONF (por defecto /etc/jzbill-docker). Para manejarlo despues, desde la
# carpeta del repo:
#   docker compose --env-file /etc/jzbill-docker/jzbill.env ps | logs app | restart app
#
# Redes:
#   bd      interna, sin salida: solo la app llega a PostgreSQL, y PostgreSQL no llega a internet.
#   salida  la de la app; le da la salida a internet que necesita para hablar con ARCA.
# Solo la app publica un puerto. La base no se ve desde fuera de Docker.
name: jzbill

services:
  db:
    image: postgres:17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    networks: [bd]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  app:
    build: .
    image: jzbill:${JZB_VERSION}
    restart: unless-stopped
    env_file: ${JZB_CONF}/jzbill.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SECRETS_KEY_FILE: /run/secrets/clave_secretos
      # Sin proxy delante: la IP del cliente es la de la conexion.
      TRUSTED_PROXIES: ""
    secrets: [clave_secretos, tls_cert, tls_key]
    ports:
      - "${JZB_BIND}:${JZB_HTTPS_PORT}:9443"
    depends_on:
      db:
        condition: service_healthy
    networks: [bd, salida]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m

secrets:
  clave_secretos:
    file: ${JZB_CONF}/clave-secretos
  tls_cert:
    file: ${JZB_CONF}/tls/cert.pem
  tls_key:
    file: ${JZB_CONF}/tls/key.pem

volumes:
  db:

networks:
  bd:
    internal: true
  salida:
