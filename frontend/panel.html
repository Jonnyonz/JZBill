<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JZBill</title>
    <link rel="stylesheet" href="/static/css/app.css?v=0.4.0">
    <script src="/static/js/tema.js?v=0.4.0"></script>
</head>
<body class="panel">
    <div class="acento-superior"></div>

    <div class="barra-movil">
        <button id="abrir-lateral" type="button" aria-label="Menú" aria-controls="lateral" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M3 6h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <svg class="icono-marca" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15l-2-1.2-2 1.2-2-1.2-2 1.2-2-1.2-2 1.2V3zM9 9h6M9 13h6M9 17h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <strong>JZBill</strong>
    </div>
    <div id="fondo-lateral" class="fondo-lateral"></div>

    <nav id="lateral" class="lateral" aria-label="Secciones">
        <div class="marca">
            <svg class="icono-marca" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15l-2-1.2-2 1.2-2-1.2-2 1.2-2-1.2-2 1.2V3zM9 9h6M9 13h6M9 17h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <h1>JZBill</h1>
        </div>
        <button class="nav-btn" type="button" data-vista="inicio" title="Inicio">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7M5 10v10h5v-6h4v6h5V10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="etiqueta-nav">Inicio</span>
        </button>
        <button class="nav-btn oculto" type="button" data-vista="facturar" data-emite title="Facturar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M12 18v-6M9 15h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="etiqueta-nav">Facturar</span>
        </button>
        <button class="nav-btn" type="button" data-vista="comprobantes" title="Comprobantes">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="etiqueta-nav">Comprobantes</span>
        </button>
        <button class="nav-btn oculto" type="button" data-vista="razones" data-admin title="Razones sociales">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5l8-3v19M12 9h8v12M7 8h2M7 12h2M7 16h2M15 13h2M15 17h2M2 21h20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="etiqueta-nav">Razones sociales</span>
        </button>
        <button class="nav-btn oculto" type="button" data-vista="sucursales" data-admin title="Sucursales">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l2-5h14l2 5M3 9h18M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0M5 12v8h14v-8M10 20v-5h4v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="etiqueta-nav">Sucursales</span>
        </button>
        <button class="nav-btn oculto" type="button" data-vista="usuarios" data-admin title="Usuarios">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 20v-2a4 4 0 0 0-3-3.9M16 2.1a4 4 0 0 1 0 7.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="etiqueta-nav">Usuarios</span>
        </button>
        <button class="nav-btn oculto" type="button" data-vista="auditoria" data-admin title="Auditoría">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="etiqueta-nav">Auditoría</span>
        </button>
        <div class="lateral-abajo">
            <button class="nav-btn" type="button" data-alternar-tema title="Tema claro u oscuro">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="etiqueta-nav">Tema claro u oscuro</span>
            </button>
            <button id="avatar-btn" class="nav-btn avatar-btn" type="button" aria-haspopup="true" aria-expanded="false" title="Cuenta y división empresa">
                <span id="avatar" class="avatar"></span>
                <span id="avatar-nombre" class="etiqueta-nav"></span>
            </button>
            <button id="salir-btn" class="nav-btn salir" type="button" title="Salir">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="etiqueta-nav">Salir</span>
            </button>
        </div>
    </nav>

    <div id="menu-avatar" class="menu-avatar oculto" role="dialog" aria-label="Cuenta y división empresa"></div>

    <div class="principal">
        <header class="encabezado">
            <h2 id="titulo-vista">Inicio</h2>
            <div id="contexto-chip" class="contexto-chip"></div>
        </header>

        <main>
            <section id="vista-inicio" class="vista"></section>
            <section id="vista-facturar" class="vista oculto"></section>
            <section id="vista-comprobantes" class="vista oculto"></section>
            <section id="vista-razones" class="vista oculto"></section>
            <section id="vista-sucursales" class="vista oculto"></section>
            <section id="vista-usuarios" class="vista oculto"></section>
            <section id="vista-auditoria" class="vista oculto"></section>
            <section id="vista-cuenta" class="vista oculto">
                <div class="tarjeta">
                    <h2>Cambiar contraseña</h2>
                    <p class="ayuda">Al cambiarla se cierran las sesiones abiertas en los demás dispositivos.</p>
                    <form id="form-clave" autocomplete="off">
                        <label>Contraseña actual <input id="clave-actual" type="password" required maxlength="128" autocomplete="current-password"></label>
                        <label>Contraseña nueva (mínimo 10 caracteres) <input id="clave-nueva" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></label>
                        <label>Repetir la contraseña nueva <input id="clave-repetida" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></label>
                        <div class="acciones"><button type="submit">Cambiar contraseña</button></div>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <p id="mensaje" class="mensaje mensaje-flotante" role="alert"></p>
    <script src="/static/js/api.js?v=0.4.0"></script>
    <script src="/static/js/facturacion.js?v=0.4.0"></script>
    <script src="/static/js/admin-razones.js?v=0.4.0"></script>
    <script src="/static/js/admin-sucursales.js?v=0.4.0"></script>
    <script src="/static/js/admin-usuarios.js?v=0.4.0"></script>
    <script src="/static/js/admin-auditoria.js?v=0.4.0"></script>
    <script src="/static/js/panel.js?v=0.4.0"></script>
</body>
</html>
